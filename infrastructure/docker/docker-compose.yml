# Local ResQNet stack: PostgreSQL and the coordination gateway.
#
# The gateway is optional by design. Nothing in the mesh depends on it, and the
# emergency network on a handset works with this entire file stopped.

name: resqnet

services:
  postgres:
    image: postgres:17-alpine
    container_name: resqnet-postgres
    environment:
      POSTGRES_DB: resqnet
      POSTGRES_USER: resqnet
      # Local development only. A real deployment supplies this from a secret
      # store and never commits a value here.
      POSTGRES_PASSWORD: resqnet-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqnet -d resqnet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: resqnet-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RESQNET_DB_URL: jdbc:postgresql://postgres:5432/resqnet
      RESQNET_DB_USER: resqnet
      RESQNET_DB_PASSWORD: resqnet-local
      # Required in every non-development profile. Generate with:
      #   openssl rand -base64 48
      # Overridden through the environment; never committed.
      RESQNET_JWT_SECRET: ${RESQNET_JWT_SECRET:?set RESQNET_JWT_SECRET in your environment}
      RESQNET_GATEWAY_TOKEN: ${RESQNET_GATEWAY_TOKEN:?set RESQNET_GATEWAY_TOKEN in your environment}
      RESQNET_ALLOWED_ORIGINS: ${RESQNET_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
