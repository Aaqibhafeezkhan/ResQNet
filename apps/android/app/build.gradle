plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.resqnet.android'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.resqnet.android'
        // Android 8.0. This is not arbitrary: java.util.Base64, which the
        // device identity needs to publish its public key, arrived in API 26.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Debug signing is used so that a clean checkout can produce a
            // release-mode build for CI verification. A real deployment supplies
            // its own keystore through ~/.gradle/gradle.properties, which is
            // never committed.
        }
    }

    compileOptions {
        // Java 17 language level, matching what mesh-core is compiled with.
        // Records and switch expressions are desugared by D8.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Provides java.util.List.of / Map.copyOf / Set.of, which mesh-core uses
        // heavily and which the platform only provides from API 30.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            // The routing engine is compiled from source rather than consumed as
            // a published artifact. This is the mechanism behind the project's
            // central claim: the handset cannot accidentally run a different
            // engine from the one the simulator and unit tests verify.
            java.srcDir rootProject.file('../../packages/mesh-core/src/main/java')
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        warningsAsErrors false
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Peer discovery and the byte pipe. Nearby Connections handles the radio
    // link only; multi-hop routing above it is ResQNet's own responsibility and
    // lives in mesh-core.
    implementation 'com.google.android.gms:play-services-nearby:19.5.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}