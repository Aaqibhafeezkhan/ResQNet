name: Feature request
description: Propose a scoped capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals scoped and specific. A feature that cannot be tested or
        whose acceptance criteria are unclear is hard to review.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the proposal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - mesh-core
        - Simulator
        - Backend gateway
        - Web command centre
        - Documentation or CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who experiences it, and when?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe the result as a user or operator would observe it.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Optional. Outline an implementation, including alternatives and trade-offs.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that can be verified in review.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, or links to the architecture and threat model.
    validations:
      required: false
