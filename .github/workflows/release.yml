name: Release

# Never runs on a push.
#
# This workflow creates a GitHub pre-release. Publishing is a deliberate act by
# a person, so the only trigger is workflow_dispatch, which cannot fire from a
# commit, a branch, a tag, a pull request or a schedule. There is deliberately
# no `push`, no `pull_request` and no `schedule` path in this file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0-alpha'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release rather than a full release'
        required: true
        default: true
        type: boolean
      dry_run:
        description: 'Build and verify everything but create no release'
        required: true
        default: true
        type: boolean
      notes_file:
        description: 'Optional path to release notes, instead of the generated ones'
        required: false
        type: string

# At the top level this workflow may only read. The single write permission
# below is scoped to the publish job and exists solely to attach files to a
# release. It cannot publish a package or push a commit.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          working-directory: apps/android

      - name: Check the requested tag matches the project version
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          # Publishing v0.3.0 with a 0.2.0 jar inside is exactly the sort of
          # mistake that is easy to make and impossible to unpick afterwards.
          #
          # The version is read from the root pom, which every module inherits.
          # It used to be read from the Android build file, which made an app
          # that ships no binary the authority for a server release.
          version=$(sed -n 's|.*<version>\(0[^<]*\)</version>.*|\1|p' pom.xml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read the project version from pom.xml"
            exit 1
          fi
          # The Android app mirrors the same version and must not drift from it.
          android=$(grep -oE "versionName '[^']+'" apps/android/app/build.gradle \
            | head -1 | sed "s/versionName '//;s/'//")
          if [ "$android" != "$version" ]; then
            echo "::error::Android versionName $android does not match pom.xml $version"
            exit 1
          fi
          expected="v$version"
          if [ "$REQUESTED_TAG" != "$expected" ]; then
            echo "::error::tag $REQUESTED_TAG does not match the project version $expected"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to release with key material in the tree
        run: |
          found=$(git ls-files | grep -E '\.(jks|keystore|p12)$' || true)
          if [ -n "$found" ]; then
            echo "::error::signing material is committed:"; echo "$found"; exit 1
          fi
          for props in $(git ls-files | grep -E 'gradle\.properties$'); do
            if git show "HEAD:$props" | grep -qE 'RESQNET_KEY|PASSWORD=|password='; then
              echo "::error::signing properties found in $props"; exit 1
            fi
          done
          echo "no signing material in the tree"

      - name: Web tests, lint and typecheck
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npx tsc -b --force
          npm run test -- --run

      # Java tests including the slow ones, then the artifact build. The same
      # script a developer runs locally, so what is published is what was
      # tested rather than a second build path that could drift from it.
      - name: Java tests including the slow ones
        run: mvn -B -ntp verify -DexcludedTestGroups=

      # No Android binary is published: physical-device networking has never
      # been tested. The script is told so explicitly rather than relying on
      # someone remembering to delete the APK directory afterwards.
      - name: Build the release artifacts
        run: bash scripts/build_release_artifacts.sh --exclude-android

      - name: Verify the published checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS

      - name: Record what the artifacts actually are
        run: |
          {
            echo "## Release build"
            echo
            echo "Tag: \`${{ inputs.tag }}\` at \`${{ github.sha }}\`"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "No Android binary is included: physical-device networking"
            echo "has never been tested. See \`apps/android/DEVICE_TESTING.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: create experimental pre-release
    needs: verify
    # Guarded twice over. `needs` means this only runs when verification passed,
    # and this condition means it does not run at all unless a person asked for
    # a real publish rather than the dry run that is the default.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Assemble the release body
        id: body
        env:
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/notes.md
          elif [ -f artifacts/RELEASE_NOTES.md ]; then
            cp artifacts/RELEASE_NOTES.md /tmp/notes.md
          else
            printf 'Experimental beta for ResQNet.\n\nSee the repository README.\n' \
              > /tmp/notes.md
          fi
          {
            echo 'notes<<RESQNET_EOF'
            cat /tmp/notes.md
            echo 'RESQNET_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }} — Experimental Developer Preview
          body: ${{ steps.body.outputs.notes }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          files: |
            artifacts/jars/*.jar
            artifacts/web/*.zip
            artifacts/SHA256SUMS
            artifacts/RELEASE_NOTES.md
            artifacts/INSTALLATION.md

      - name: Explain what was and was not verified
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Release created

          **Experimental developer preview.** No Android binary is attached:
          two physical Android phones have never exchanged a message. The
          defects that would each have prevented it were found by reading the
          code, and none of that is proof the radio path works.

          Verify with `sha256sum -c SHA256SUMS` beside the artifacts.
          SUMMARY